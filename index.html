<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO: 主站收录优先, 开源演示页作为镜像入口 -->
    <title>ProductsX — B2B Product Feed &amp; Worldwide Supplier Directory (Open Source)</title>
    <meta name="description" content="ProductsX is an open global B2B marketplace index. Browse the latest product listings from verified manufacturers and wholesale suppliers worldwide — fully open-source frontend powered by the public ProductsX API.">
    <meta name="keywords" content="B2B marketplace, wholesale suppliers, manufacturers directory, product sourcing, supplier search, global trade, open source, ProductsX">
    <link rel="canonical" href="https://productsx.app/">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ProductsX">
    <meta property="og:title" content="ProductsX — B2B Product Feed &amp; Worldwide Supplier Directory">
    <meta property="og:description" content="Discover quality products, suppliers, and manufacturing partners worldwide. Open-source frontend powered by the public ProductsX API.">
    <meta property="og:url" content="https://productsx.app/">
    <meta name="twitter:card" content="summary">

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ProductsX",
      "url": "https://productsx.app/",
      "description": "Open global B2B marketplace index for products, suppliers and manufacturers.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://productsx.app/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ProductsX",
      "url": "https://productsx.app/",
      "sameAs": ["https://github.com/"]
    }
    </script>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000000'/%3E%3Cpath d='M8 24L24 8M8 8l6 6M18 18l6 6' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/productsx.css">
</head>
<body>
    <!-- ─── Header ─────────────────────────────────────── -->
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="https://productsx.app/" target="_blank" rel="noopener">
                <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="var(--logo-bg)"></rect>
                    <path d="M8 24L24 8M8 8l6 6M18 18l6 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"></path>
                </svg>
                <span class="brand-name">ProductsX<em>.app</em></span>
            </a>
            <form class="search-box" action="https://productsx.app/search" method="get" target="_blank" role="search"
                  id="pxSearchRoot" autocomplete="off">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" name="q" id="pxSearchInput" placeholder="Search name, specs, model, certification, or supplier..."
                       aria-label="Search products and suppliers on ProductsX"
                       role="combobox" aria-expanded="false" aria-controls="pxSearchResults" aria-autocomplete="list">
                <div class="search-dropdown" id="pxSearchDropdown" aria-hidden="true">
                    <div class="search-results" id="pxSearchResults" role="listbox" aria-live="polite"></div>
                </div>
            </form>
            <nav class="header-nav" aria-label="Primary">
                <a href="index.html" class="nav-link active">Products</a>
                <a href="suppliers.html" class="nav-link">Suppliers</a>
                <a href="https://productsx.app/explore" class="nav-link" target="_blank" rel="noopener">Explore</a>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </nav>
        </div>
    </header>

   

    <!-- ─── Feed ───────────────────────────────────────── -->
    <main class="main-area">
        <!-- View switcher: Waterfall / Matrix (参考主站首页) -->
        <div class="view-toolbar">
            <div class="view-switcher" role="tablist" aria-label="View mode">
                <button type="button" class="view-btn active" id="btnFeedView" role="tab" aria-selected="true">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Feed
                </button>
                <button type="button" class="view-btn" id="btnMatrixView" role="tab" aria-selected="false">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    Matrix
                </button>
            </div>
        </div>

        <div id="feedView">
            <div class="feed-container" id="feed">
                <!-- product cards injected by js/productsx.js -->
            </div>
        </div>

        <!-- Matrix table view (参考主站首页) -->
        <div id="matrixView" hidden>
            <div class="matrix-container" id="matrix">
                <div class="matrix-grid matrix-grid-header">
                    <div class="matrix-cell matrix-col-title">Product Title &amp; Specs</div>
                    <div class="matrix-cell matrix-col-supplier">Supplier</div>
                    <div class="matrix-cell matrix-col-price">Ref. Price</div>
                    <div class="matrix-cell matrix-col-moq">MOQ</div>
                    <div class="matrix-cell matrix-col-certs">Certs</div>
                    <div class="matrix-cell matrix-col-lead">Lead Time</div>
                    <div class="matrix-cell matrix-col-channel">Channel</div>
                    <div class="matrix-cell matrix-col-posted">Posted</div>
                </div>
            </div>
        </div>

        <div class="feed-status" id="feedStatus" role="status" aria-live="polite">Loading products…</div>
        <noscript>
            <p class="noscript-tip">JavaScript is disabled. Browse the full catalog directly on
                <a href="https://productsx.app/" rel="noopener">ProductsX.app</a>.</p>
        </noscript>
    </main>

    <!-- Back to top (第3页后出现, 参考主站) -->
    <button type="button" class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
    </button>

    <!-- ─── Split Detail Panel (Google Images style) ───── -->
    <div class="detail-overlay" id="detailOverlay" hidden></div>
    <aside class="detail-panel" id="detailPanel" role="dialog" aria-modal="false" aria-label="Product detail" hidden>
        <header class="detail-head">
            <h2 class="detail-title" id="detailTitle">Product</h2>
            <button type="button" class="detail-close" id="detailClose" aria-label="Close panel">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </header>
        <div class="detail-body" id="detailBody"><!-- injected --></div>
    </aside>

    <!-- ─── Footer ─────────────────────────────────────── -->
    <footer class="site-footer">
        <p>
            <a href="https://productsx.app/" target="_blank" rel="noopener">ProductsX.app</a> ·
            <a href="https://productsx.app/about" target="_blank" rel="noopener">About</a> ·
            <a href="https://productsx.app/privacy" target="_blank" rel="noopener">Privacy</a> ·
            <a href="https://productsx.app/terms" target="_blank" rel="noopener">Terms</a>
        </p>
        <p class="footer-note">Open-source frontend · Data via the public
            <a href="https://productsx.app/api/posts" target="_blank" rel="noopener">ProductsX API</a> · MIT License</p>
    </footer>

    <script src="js/productsx.js"></script>
</body>
</html>
